<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Những Điều Dịu Dàng Dành Cho Em</title>
  <desc id="desc">Cinematic dark stage cover with soft rose light.</desc>
  <defs>
