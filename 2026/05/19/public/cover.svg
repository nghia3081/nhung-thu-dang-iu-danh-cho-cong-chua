  <text x="800" y="502" text-anchor="middle" fill="#f5f5f7" fill-opacity=".72" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="30" font-weight="650" letter-spacing="0">Nhung Dieu Diu Dang Danh Cho Em</text>
